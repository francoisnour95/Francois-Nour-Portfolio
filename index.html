<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v2.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png">
<meta name="theme-color" content="#1c2230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="F. Nour">
<meta name="description" content="Interactive mind map of François Elias Nour's work: actor, architect, 3D generalist, artist, teacher.">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>François Elias Nour</title>
<style>
:root{--bg:#3b3b3b;--dot:#595959;--ink:#1b1b1b;--panel:#1e1e1e;--x:#f2d15c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2a2c;color:#fff;
  font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:24px 24px}
#stage.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.link{fill:none;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .55s ease}
.link.on{stroke-dashoffset:0}
.xlink{fill:none;stroke:var(--x);stroke-width:1.8;stroke-dasharray:5 7;opacity:0;transition:opacity .4s;animation:march 1s linear infinite}
.xlink.on{opacity:.9}
@keyframes march{to{stroke-dashoffset:-12}}

/* nodes */
.node{position:absolute;left:0;top:0;white-space:nowrap}
.node:not(.shown){pointer-events:none}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.07) 55%,rgba(255,255,255,.12));
  -webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);
  border:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 18px rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.28)}
.pill{display:inline-flex;align-items:center;gap:9px;color:#fff;border-radius:999px;padding:11px 18px;font-size:17px;font-weight:500;
  letter-spacing:.01em;cursor:pointer;user-select:none;text-shadow:0 1px 2px rgba(0,0,0,.35);
  opacity:0;transform:scale(.55);
  transition:opacity .35s,transform .4s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,border-color .25s,filter .35s}
.node.shown .pill{opacity:1;transform:scale(1)}
.pill:hover{border-color:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 18px rgba(255,255,255,.1),0 0 22px -2px var(--c),0 10px 28px rgba(0,0,0,.28)}
.node.selected .pill{border-color:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 22px color-mix(in srgb,var(--c) 45%,transparent),0 0 26px -2px var(--c),0 10px 28px rgba(0,0,0,.3)}
.node.related .pill{border-color:var(--x);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 20px -3px var(--x),0 10px 28px rgba(0,0,0,.28)}
.more{font-size:14px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--c);color:#fff;font-weight:700;line-height:1;text-shadow:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 6px rgba(0,0,0,.3);transition:transform .2s}
.more:hover{transform:scale(1.18)}
/* branch focus: everything outside the open branch fades back */
.link{transition:stroke-dashoffset .55s ease,opacity .4s}
#stage.focus .node.shown:not(.inbranch):not(.related) .pill{opacity:.28;filter:saturate(.2)}
#stage.focus .link:not(.inbranch){opacity:.15}

/* centre */
#root{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:260px;height:260px}
#face{width:100%;height:100%;border-radius:27%;border:none;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.16),rgba(255,255,255,.05) 60%,rgba(255,255,255,.1));
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -8px 24px rgba(255,255,255,.05),inset 0 0 30px rgba(255,255,255,.06),0 16px 44px rgba(0,0,0,.35);overflow:visible;cursor:pointer;position:relative}
#face svg,#face img{width:100%;height:100%;display:block;object-fit:cover;overflow:visible}
#face img{transform-origin:50% 60%}
.fan{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rgb{animation:hue 3s linear infinite}
.tassel{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
.bubbles{animation:bub 1.6s ease-in infinite}
@keyframes bub{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#name{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35);
  font-size:17px;padding:11px 20px;border-radius:999px;white-space:nowrap;cursor:pointer}
.eye{transform-box:fill-box;transform-origin:center;transition:transform .07s}
.blink .eye{transform:scaleY(.08)}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .07s}
.blink .lid{transform:scaleY(1)}

/* panel */
#panel{position:fixed;left:50%;bottom:14px;width:min(1040px,calc(100vw - 28px));height:min(46vh,440px);z-index:5;
  transform:translate(-50%,calc(100% + 30px));transition:transform .55s cubic-bezier(.2,.9,.25,1);
  border-radius:30px;padding:26px 30px 24px;overflow:hidden;color:#fff;
  background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 45%,rgba(255,255,255,.1));
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 40px rgba(255,255,255,.05),0 -10px 60px rgba(0,0,0,.35)}
#panel.open{transform:translate(-50%,0)}
#panel .grab{position:absolute;left:0;right:0;top:0;height:34px;touch-action:none;cursor:grab;z-index:1}
#panel .grab::before{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;margin-left:-22px;border-radius:9px;background:rgba(255,255,255,.35)}
#panel .text{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#panel .inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;height:100%;padding-top:20px}
#panel .text{overflow:auto;padding-right:6px}
#panel .crumb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px}
#panel .crumb i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}
#panel h2{margin:8px 0 12px;font-size:32px;font-weight:650;letter-spacing:-.01em}
#panel p{line-height:1.6;color:rgba(255,255,255,.85);margin:0 0 14px}
#panel .media{border-radius:20px;display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:14px;
  background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
#panel h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);margin:18px 0 10px}
.chip{display:inline-block;margin:0 8px 8px 0;padding:8px 14px;border-radius:999px;color:#fff;font:inherit;font-size:14px;cursor:pointer;border-color:var(--x)!important}
.chip:hover{background:var(--x);color:#111}
.btn{display:inline-block;padding:9px 16px;border-radius:999px;background:var(--c);color:#fff;text-decoration:none;font-size:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
#close{position:absolute;top:10px;right:14px;width:30px;height:30px;border-radius:50%;color:#fff;font-size:20px;line-height:1;cursor:pointer;z-index:1}
#panel .media.film{place-items:stretch;padding:0;overflow:hidden}
.fcard{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:26px 28px;color:#fff;text-decoration:none;
  background:radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--c) 45%,transparent),transparent 60%),
             linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55));min-height:100%}
.fcard::before{content:"";position:absolute;inset:14px 14px auto 14px;height:18px;border-radius:4px;opacity:.35;
  background:repeating-linear-gradient(90deg,#fff 0 10px,transparent 10px 22px)}
.fcard .fk{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.fcard .ft{font-size:clamp(26px,3.4vw,42px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
.fcard .fm{font-size:15px;color:rgba(255,255,255,.85)}
.fcard .fn{font-size:13px;color:rgba(255,255,255,.65)}
.fcard .fgo{margin-top:10px;align-self:flex-start;padding:7px 14px;border-radius:999px;font-size:13px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);transition:background .2s}
.fcard:hover .fgo{background:var(--c)}
#panel .media.film{display:flex;gap:14px;padding:12px;place-items:initial;overflow:hidden}
#panel .media.film .poster{flex:0 0 auto;height:100%;aspect-ratio:2/3;padding:0;border:0;border-radius:14px;overflow:hidden;cursor:zoom-in;background:#111;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#panel .media.film .poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
#panel .media.film .poster:hover img{transform:scale(1.04)}
.fside{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;position:relative;border-radius:14px;overflow:hidden;
  background:var(--bk) center/cover no-repeat}
.fside[style]::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.75))}
.fside>*{position:relative}
.fside .fcard{flex:1;min-height:0;padding:14px 16px 6px;background:none}
.fside .fcard::before{display:none}
.fside .fcard .ft{font-size:clamp(22px,2.6vw,34px)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:0 4px 4px;scrollbar-width:thin;overscroll-behavior-x:contain;touch-action:pan-x}
.thumbs .th{flex:0 0 auto;width:92px;aspect-ratio:3/2;border-radius:10px;overflow:hidden;padding:0;cursor:zoom-in;
  border:1px solid rgba(255,255,255,.3);background:#111}
.thumbs .th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.thumbs .th:hover img{transform:scale(1.08)}
.fcredit{font-size:11px;color:rgba(255,255,255,.55);padding:0 6px}
.reel{border-radius:12px;overflow:hidden;aspect-ratio:16/9;max-height:52%;background:#000;flex:0 0 auto}
.reel iframe{width:100%;height:100%;border:0;display:block}
.fside:has(.reel) .fcard{flex:0 0 auto;padding:0 6px}
.fside:has(.reel) .fcard>:not(.fgo){display:none}
.fside:has(.reel) .fcard .fgo{margin-top:0}
.fside:has(.reel) .reel{flex:1 1 auto;max-height:none;min-height:0;aspect-ratio:auto}
.fside:has(.reel) .thumbs .th{width:62px;aspect-ratio:3/4}
#lightbox{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,10,14,.72);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .25s;touch-action:none}
#lightbox.open{opacity:1;pointer-events:auto}
#lb-img{max-width:min(92vw,1400px);max-height:80vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);user-select:none;-webkit-user-drag:none}
.lb-btn{position:absolute;width:48px;height:48px;border-radius:50%;color:#fff;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center}
#lb-prev{left:18px;top:50%;margin-top:-24px} #lb-next{right:18px;top:50%;margin-top:-24px} #lb-close{right:18px;top:18px;font-size:22px}
#lb-cap{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:999px;color:#fff;font-size:13px;white-space:nowrap}
@media (max-width:700px){
  #panel .inner{display:block;overflow-y:auto;height:100%;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  #panel .text{overflow:visible;padding-right:0}
  #panel .media{margin-top:16px;min-height:160px}
  #panel .media.film{flex-direction:column;min-height:0}
  #panel .media.film .poster{height:auto;width:58%;align-self:center}
  .fside .fcard{flex:none}
  .fside:has(.reel) .reel{aspect-ratio:16/9;flex:none}
  #lb-prev,#lb-next{top:auto;bottom:70px;margin-top:0}
}
@media (max-width:700px){#panel{height:58vh;padding:24px 18px}#panel .inner{grid-template-columns:1fr;overflow:auto}#panel .media{min-height:180px}}

/* background carousel */
#bgc{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
#bgc .slide{position:absolute;inset:-4%;background:center/cover no-repeat;opacity:0;transform:scale(1.04);
  transition:opacity 1.6s ease,transform 9s linear;filter:saturate(.9)}
#bgc .slide.on{opacity:1;transform:scale(1.12)}
#bgc::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 45%,rgba(40,40,42,.45),rgba(28,28,30,.78) 75%),rgba(30,30,32,.25)}
#stage{z-index:1}
/* info button */
body{--ib:16px}
#info{position:fixed;left:16px;bottom:var(--ib);z-index:6;width:40px;height:40px;border-radius:50%;color:#fff;cursor:pointer;
  font:italic 600 19px Georgia,"Times New Roman",serif;display:grid;place-items:center;padding:0;
  transition:bottom .55s cubic-bezier(.2,.9,.25,1),transform .2s}
#info:hover{transform:scale(1.08)}
body.sheet{--ib:var(--lift,480px)}
#infoCard{position:fixed;left:16px;bottom:calc(var(--ib) + 52px);z-index:6;width:min(320px,calc(100vw - 32px));border-radius:22px;padding:18px 20px;color:#fff;
  opacity:0;transform:translateY(8px) scale(.97);transform-origin:0 100%;pointer-events:none;
  transition:opacity .25s,transform .25s,bottom .55s cubic-bezier(.2,.9,.25,1)}
#infoCard.open{opacity:1;transform:none;pointer-events:auto}
#infoCard h4{margin:0 0 6px;font-size:16px}
#infoCard p{margin:0 0 10px;font-size:14px;line-height:1.5;color:rgba(255,255,255,.85)}
#infoCard .ic-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:6px}
#infoCard .ic-credit{font-size:12px;color:rgba(255,255,255,.55)}
#infoCard h4,#infoCard p{transition:opacity .3s}
/* ui */
#ui{position:fixed;left:66px;bottom:16px;z-index:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center;transition:opacity .3s}
body.sheet #ui{opacity:0;pointer-events:none}
#ui button{color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
#hint{font-size:12px;color:#9a9a9a;margin-left:6px}
</style>
</head>
<body>
<div id="bgc"><div class="slide"></div><div class="slide"></div></div>
<div id="stage">
  <div id="world">
    <svg id="links"><defs id="defs"></defs></svg>
    <div id="root">
      <div id="face" title="Click to unfold everything"></div>
      <div id="name" class="glass">François Elias Nour</div>
    </div>
  </div>
</div>

<aside id="panel" class="glass-sheet">
  <div class="grab" aria-hidden="true"></div>
  <button id="close" class="glass" aria-label="Close">×</button>
  <div class="inner">
    <div class="text">
      <div class="crumb" id="p-crumb"></div>
      <h2 id="p-title"></h2>
      <p id="p-text"></p>
      <div id="p-link"></div>
      <div id="p-rel"></div>
    </div>
    <div class="media" id="p-media">Images / video / 3D viewer go here</div>
  </div>
</aside>

<div id="lightbox" aria-modal="true" role="dialog">
  <img id="lb-img" alt="">
  <button class="lb-btn glass" id="lb-prev" aria-label="Previous">‹</button>
  <button class="lb-btn glass" id="lb-next" aria-label="Next">›</button>
  <button class="lb-btn glass" id="lb-close" aria-label="Close">×</button>
  <div id="lb-cap" class="glass"></div>
</div>
<button id="info" class="glass" aria-label="About the background image">i</button>
<div id="infoCard" class="glass">
  <div class="ic-top"><span id="ic-branch"></span><span id="ic-count"></span></div>
  <h4 id="ic-title"></h4>
  <p id="ic-text"></p>
  <div class="ic-credit" id="ic-credit"></div>
</div>
<div id="ui">
  <button id="b-reset" class="glass">Reset view</button>
  <button id="b-all" class="glass">Unfold all</button>
  <button id="b-in" class="glass">＋</button><button id="b-out" class="glass">－</button>

/* =========================================================
   3. ENGINE
   ========================================================= */
const $ = s => document.querySelector(s);
const stage=$('#stage'), world=$('#world'), svg=$('#links'), defs=$('#defs');
const R = 130, NS='http://www.w3.org/2000/svg';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const N = {}, TOP = [];

function marker(color){
  const id='m'+color.slice(1);
  if(!document.getElementById(id)){
    const m=document.createElementNS(NS,'marker');
    Object.entries({id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'}).forEach(([k,v])=>m.setAttribute(k,v));
    m.innerHTML=`<path d="M0,0 L10,5 L0,10z" fill="${color}"/>`;
    defs.appendChild(m);
  }
  return `url(#${id})`;
}

function build(d,parent,side){
  const n={d,parent,side,children:[],expanded:false,shown:false,color:d.color||parent.color};
  N[d.id]=n;
  const el=document.createElement('div'); el.className='node';
  el.style.setProperty('--c',n.color);
  const has=d.children&&d.children.length;
  el.innerHTML=`<span class="pill glass">${side<0&&has?'<span class="more">+</span>':''}${d.label}${side>0&&has?'<span class="more">+</span>':''}</span>`;
  world.appendChild(el);
  n.el=el; n.pill=el.firstChild; n.more=el.querySelector('.more');
  n.pill.addEventListener('pointerdown',e=>{ n._pt=e.pointerType; });
  n.pill.addEventListener('click',e=>{ e.stopPropagation();
    const m=e.target.closest('.more');
    // on touch, the badge only counts when it's big enough to aim at; otherwise the tap opens the bubble
    const badge=m&&(n._pt==='mouse'||m.getBoundingClientRect().width>=20);
    if(badge) return toggle(n);
    if(n.children.length&&n.expanded){                       // already open with a "–": fold it back
      collapse(n); if(current!==n) setPanel(n);
      $('#panel').classList.add('open'); document.body.classList.add('sheet'); setTimeout(focusBranch,60);
    } else openPanel(n); });
  (d.children||[]).forEach(c=>n.children.push(build(c,n,side)));
  return n;
}
DATA.forEach(d=>TOP.push(build(d,null,Math.sign(d.pos[0])||1)));

/* ---------- layout: every open sub-branch gets its own room, the rest slides out of the way ---------- */
const ROW=76, BRANCH_GAP=26;
function initNode(n){
  n.w=n.el.offsetWidth; n.x=n.y=n.tx=n.ty=0;
  const p=document.createElementNS(NS,'path');
  p.setAttribute('class','link'); p.setAttribute('pathLength','1'); p.setAttribute('stroke',n.color);
  svg.appendChild(p); n.link=p;
  n.children.forEach(initNode);
}
TOP.forEach(initNode);
const ext=n=>n.expanded&&n.children.length?Math.max(ROW,n.children.reduce((t,c)=>t+ext(c),0)):ROW;
function place(n,y){
  n.ty=y;
  n.children.forEach(c=>c.tx=n.tx+n.side*(n.w+100));
  if(!n.children.length) return;
  const hs=n.children.map(c=>n.expanded?ext(c):ROW), tot=hs.reduce((a,b)=>a+b,0);
  let y0=y-tot/2; n.children.forEach((c,i)=>{ place(c,y0+hs[i]/2); y0+=hs[i]; });
}
function computeLayout(){
  for(const side of [-1,1]){
    const ns=TOP.filter(t=>t.side===side).sort((a,b)=>a.d.pos[1]-b.d.pos[1]);
    const y=ns.map(t=>t.d.pos[1]), e=ns.map(ext);
    for(let it=0;it<60;it++){ let moved=false;
      for(let i=0;i<ns.length-1;i++){ const d=(y[i]+e[i]/2+BRANCH_GAP)-(y[i+1]-e[i+1]/2);
        if(d>0.5){ y[i]-=d/2; y[i+1]+=d/2; moved=true; } }
      if(!moved) break; }
    ns.forEach((t,i)=>{ t.tx=t.d.pos[0]; place(t,y[i]); });
  }
}
function drawNode(n){
  n.el.style.transform=`translate(${n.x}px,${n.y}px) translate(${n.side<0?'-100%':'0'},-50%)`;
  let sx,sy;
  if(n.parent){ sx=n.parent.x+n.side*n.parent.w; sy=n.parent.y; }
  else{ const a=Math.atan2(n.y,n.x), c=Math.abs(Math.cos(a)), sn=Math.abs(Math.sin(a)), r=R/Math.pow(c**4+sn**4,.25);   // edge of the rounded-square face box
    sx=r*Math.cos(a); sy=r*Math.sin(a); }
  const ex=n.x-n.side*3, ey=n.y, c=Math.max(50,Math.abs(ex-sx)*.5);
  n.link.setAttribute('d',`M${sx},${sy} C${sx+n.side*c},${sy} ${ex-n.side*c},${ey} ${ex},${ey}`);
}
const ALL=()=>Object.values(N);
let layAnim=null, layQueued=false;
function relayout(snap){
  computeLayout();
  const nodes=ALL();
  nodes.forEach(n=>{ if(snap||!n.el.classList.contains('shown')){ n.x=n.tx; n.y=n.ty; } n.fx=n.x; n.fy=n.y; });
  cancelAnimationFrame(layAnim);
  const t0=performance.now(), D=snap?0:520, ease=t=>1-Math.pow(1-t,3);
  (function frame(now){
    const k=D?ease(Math.min(1,(now-t0)/D)):1;
    nodes.forEach(n=>{ n.x=n.fx+(n.tx-n.fx)*k; n.y=n.fy+(n.ty-n.fy)*k; });
    nodes.forEach(drawNode); try{ updateX(); }catch(_){}
    if(k<1) layAnim=requestAnimationFrame(frame);
  })(t0);
}
function scheduleLayout(){ if(layQueued) return; layQueued=true; requestAnimationFrame(()=>{ layQueued=false; relayout(false); }); }
relayout(true);

function show(n,delay=0){
  n.shown=true;
  setTimeout(()=>{
    if(!n.shown)return;
    n.link.classList.add('on'); n.el.classList.add('shown');
    setTimeout(()=>{ if(n.shown) n.link.setAttribute('marker-end',marker(n.color)); },450);
  },delay);
}
function hide(n){
  n.children.forEach(hide);
  n.shown=false; n.expanded=false;
  n.el.classList.remove('shown','selected','related');
  n.link.classList.remove('on'); n.link.removeAttribute('marker-end');
  if(n.more) n.more.textContent='+';
}
function expand(n){ if(n.expanded||!n.children.length)return; n.expanded=true; n.more.textContent='–'; n.children.forEach((c,i)=>show(c,i*90)); scheduleLayout(); }
function collapse(n){
  if(current&&current!==n&&isIn(current,n)) setPanel(n);   // the open bubble is being folded away → show its parent
  n.expanded=false; if(n.more)n.more.textContent='+'; n.children.forEach(hide); scheduleLayout();
}
function isIn(n,anc){ for(let p=n.parent;p;p=p.parent) if(p===anc) return true; return false; }
function toggle(n){ n.expanded?collapse(n):expand(n); if(current&&branchOf(n)===branchOf(current)) setTimeout(focusBranch,60); }
function reveal(n){ const chain=[]; for(let p=n.parent;p;p=p.parent)chain.unshift(p); chain.forEach(expand); }
function all(open){ const walk=n=>{ open?expand(n):collapse(n); if(open)n.children.forEach(walk); }; TOP.forEach(walk); }

/* ---------- panel + cross links ---------- */
let current=null; const xlinks=[];
const center=n=>({x:n.x+n.side*n.w/2,y:n.y});
function xPath(p){ const a=center(p._a),b=center(p._b),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y;
  p.setAttribute('d',`M${a.x},${a.y} Q${mx-dy*.25},${my+dx*.25} ${b.x},${b.y}`); }
function updateX(){ xlinks.forEach(xPath); }
function clearX(){ xlinks.forEach(p=>p.remove()); xlinks.length=0; document.querySelectorAll('.related,.selected').forEach(e=>e.classList.remove('related','selected')); }
function related(n){ return CROSS.filter(p=>p.includes(n.d.id)).map(p=>N[p[0]===n.d.id?p[1]:p[0]]).filter(Boolean); }
function branchOf(n){ while(n&&n.parent)n=n.parent; return n; }
function setPanel(n){
  clearX(); current=n; n.el.classList.add('selected');
  const P=$('#panel'); P.style.setProperty('--c',n.color);
  const path=[]; for(let p=n.parent;p;p=p.parent) path.unshift(p.d.label);
  $('#p-crumb').innerHTML='<i></i>'+(path.length?path.join(' › '):'François Elias Nour');
  $('#p-title').textContent=n.d.label;
  $('#p-text').textContent=n.d.text||'';
  $('#p-link').innerHTML=n.d.url?`<a class="btn" href="${n.d.url}" target="_blank" rel="noopener">${n.d.linkLabel||'Open website'} ↗</a>`:'';
  renderMedia(n);
  const rel=related(n);
  $('#p-rel').innerHTML=rel.length?'<h3>Connected to</h3>'+rel.map(r=>`<button class="chip glass" data-id="${r.d.id}">${r.d.label}</button>`).join(''):'';
  rel.forEach(r=>{
    reveal(r);
    setTimeout(()=>{
      if(current!==n||!r.shown)return;
      r.el.classList.add('related');
      const p=document.createElementNS(NS,'path'); p._a=n; p._b=r; xPath(p);
      p.setAttribute('class','xlink'); svg.insertBefore(p,svg.firstChild.nextSibling);
      xlinks.push(p); requestAnimationFrame(()=>p.classList.add('on'));
    },500);
  });
  markBranch(); if(typeof updateSlides==='function') updateSlides();
}
function markBranch(){
  const br=current&&branchOf(current);
  Object.values(N).forEach(m=>{ const on=!!br&&branchOf(m)===br; m.el.classList.toggle('inbranch',on); m.link.classList.toggle('inbranch',on); });
  stage.classList.toggle('focus',!!br);
  if(typeof updateSlides==='function') updateSlides();
}
function openPanel(n){
  const wasBranch=current&&branchOf(current);
  expand(n);                                  // show its sub-bubbles
  setPanel(n);
  $('#panel').classList.add('open'); document.body.classList.add('sheet');
  if(wasBranch!==branchOf(n)) focusBranch(); else setTimeout(focusBranch,60);
}
function renderMedia(n){
  const d=n.d, F=d.film, M=$('#p-media');
  if(!F){ M.className='media'; M.textContent='Images / video / 3D viewer go here'; return; }
  const G=d.gallery||[], back=!d.poster&&G[0]?`style="--bk:url('${G[0]}')"`:'';
  M.className='media film'+(d.poster?' has-poster':'');
  M.innerHTML=`
    ${d.poster?`<button class="poster" data-i="-1" aria-label="View poster"><img src="${d.poster}" alt="${d.label} poster" onerror="this.closest('.poster').remove()"></button>`:''}
    <div class="fside" ${back}>
      ${d.video?`<div class="reel"><iframe src="${d.video}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Showreel" loading="lazy"></iframe></div>`:''}
      <a class="fcard" ${d.url?`href="${d.url}" target="_blank" rel="noopener"`:''}>
        <div class="fk">${F.kind}</div>
        <div class="ft">${d.label}</div>
        <div class="fm">${F.generic?'':F.agent?F.by:(F.year+' · '+(F.site?'written & directed by ':'directed by ')+F.by)}</div>
        <div class="fn">${F.note}</div>
        ${d.url?`<div class="fgo">${F.site||(F.agent?'listalent.com':'IMDb')} ↗</div>`:''}</a>
      ${G.length?`<div class="thumbs">${G.map((u,i)=>`<button class="th" data-i="${i}"><img src="${u}" alt="" loading="lazy" onerror="this.parentNode.remove()"></button>`).join('')}</div>`:''}
      ${d.credit?`<div class="fcredit">${d.credit}</div>`:''}
    </div>`;
  M.onclick=e=>{ const b=e.target.closest('[data-i]'); if(!b) return; e.preventDefault();
    const list=[...(d.poster?[d.poster]:[]),...G]; openLightbox(list,(+b.dataset.i)+(d.poster?1:0),d.label); };
}
/* ---------- lightbox ---------- */
let lb=null;
function openLightbox(list,i,title){
  lb={list,i,title}; const L=$('#lightbox'); L.classList.add('open'); showLB();
}
function showLB(){ if(!lb) return; const {list,i,title}=lb;
  $('#lb-img').src=list[i]; $('#lb-cap').textContent=`${title} · ${i+1} / ${list.length}`; }
function stepLB(k){ if(!lb) return; lb.i=(lb.i+k+lb.list.length)%lb.list.length; showLB(); }
function closeLB(){ lb=null; $('#lightbox').classList.remove('open'); }
function closePanel(){
  if(!current) return;
  $('#panel').classList.remove('open'); document.body.classList.remove('sheet');
  current=null; clearX(); markBranch(); glide(home());
}
$('#close').onclick=closePanel;
$('#p-rel').onclick=e=>{ const id=e.target.dataset.id; if(id){ reveal(N[id]); setTimeout(()=>openPanel(N[id]),300);} };
addEventListener('keydown',e=>{ if(lb){ if(e.key==='Escape')closeLB(); if(e.key==='ArrowRight')stepLB(1); if(e.key==='ArrowLeft')stepLB(-1); return; } if(e.key==='Escape')closePanel(); });
$('#lb-prev').onclick=e=>{e.stopPropagation();stepLB(-1)}; $('#lb-next').onclick=e=>{e.stopPropagation();stepLB(1)};
$('#lb-close').onclick=closeLB; $('#lightbox').onclick=e=>{ if(e.target.id==='lightbox') closeLB(); };
(function(){ let sx=null; const L=$('#lightbox');
  L.addEventListener('pointerdown',e=>{sx=e.clientX}); L.addEventListener('pointerup',e=>{ if(sx!==null&&Math.abs(e.clientX-sx)>50) stepLB(e.clientX<sx?1:-1); sx=null; }); })();

/* ---------- camera: pan & zoom ---------- */
const cam={x:0,y:0,s:1};
function apply(){
  world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.s})`;
  stage.style.backgroundPosition=`${cam.x}px ${cam.y}px`;
  stage.style.backgroundSize=`${24*cam.s}px ${24*cam.s}px`;
}
function home(){
  // frame the face plus every bubble that is showing (targets, so it works mid-animation)
  const vis=Object.values(N).filter(n=>n.shown);
  const xs=[-150,150,...vis.flatMap(n=>[n.tx,n.tx+n.side*n.w])], ys=[-150,170,...vis.map(n=>n.ty-26),...vis.map(n=>n.ty+26)];
  const x0=Math.min(...xs)-30,x1=Math.max(...xs)+30,y0=Math.min(...ys)-20,y1=Math.max(...ys)+20, bottomUI=70;
  const s=clamp(Math.min(innerWidth/(x1-x0),(innerHeight-bottomUI)/(y1-y0)),.3,1);
  return {s,x:innerWidth/2-(x0+x1)/2*s,y:(innerHeight-bottomUI)/2-(y0+y1)/2*s};
}
function fit(){ Object.assign(cam,home()); world.style.transition=''; apply(); }
function glide(t){ Object.assign(cam,t); world.style.transition='transform .7s cubic-bezier(.2,.8,.2,1)'; apply(); setTimeout(()=>world.style.transition='',750); }
/* zoom onto the open branch (plus the face), in the space above the glass sheet */
function focusBranch(){
  if(!current) return;
  const br=branchOf(current), pts=[];
  (function walk(n){ pts.push(n); if(n.expanded) n.children.forEach(walk); })(br);
  const xs=[-135,135,...pts.flatMap(q=>[q.tx,q.tx+q.side*q.w])], ys=[-135,160,...pts.map(q=>q.ty-28),...pts.map(q=>q.ty+28)];
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sheet=$('#panel').offsetHeight+14, W=innerWidth, H=innerHeight-sheet, m=36;
  const s=clamp(Math.min((W-2*m)/(x1-x0),(H-2*m)/(y1-y0)),.3,1.3);
  glide({s,x:W/2-(x0+x1)/2*s,y:H/2-(y0+y1)/2*s});
}
function zoomAt(k,mx,my){ const ns=clamp(cam.s*k,.3,2.5); cam.x=mx-(mx-cam.x)*ns/cam.s; cam.y=my-(my-cam.y)*ns/cam.s; cam.s=ns; apply(); }
/* ---------- touch & mouse: drag to pan (with momentum), pinch to zoom, double-tap to zoom, tap background to close ---------- */
const pts=new Map(); let drag=null, pinch=null, inertia=null, lastTap={t:0,x:0,y:0}, suppressClick=0;
function stopInertia(){ if(inertia){ cancelAnimationFrame(inertia); inertia=null; } }
function mid(){ const a=[...pts.values()]; return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}; }
function startPinch(){ const m=mid(); pinch={d:m.d,s:cam.s,mx:m.x,my:m.y,cx:cam.x,cy:cam.y}; drag=null; suppressClick=performance.now()+400; }
stage.addEventListener('pointerdown',e=>{
  stopInertia(); world.style.transition='';
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ startPinch(); return; }

  if(e.target.closest('.pill,#root')) return;                 // taps on bubbles / face stay clicks

/* shared: costume animation (drop-in / pop-in, weighted by proximity) */
function makeCostumes(q){
  const all=sel=>[...faceEl.querySelectorAll(sel)];
  const C={}; ['pc','turtle','bandana','pen','hat','headset','straw','geekglasses','archglasses','vr','snorkel','snorkelbody','gradcap','gradbody']
    .forEach(k=>C[k]=all(`#c-${k},.c-${k}`));
  const M={geek:q('#m-geek'),cow:q('#m-cow'),arch:q('#m-arch'),art:q('#m-art')};
  const pop=(els,w,t)=>els.forEach(el=>{ el.style.opacity=w; el.style.display=w<.01?'none':''; if(t!==null) el.setAttribute('transform',t); });
  const e=t=>t*t*(3-2*t);
  return (x,y,w)=>{
    const g=w.geek,c=w.cowboy,a=w.architect,v=w.vr,sn=w.snorkel;
    for(const [k,val] of [['geek',g],['cow',c],['arch',a]]) M[k]&&M[k].setAttribute('opacity',val);
    pop(C.pc,g,`translate(${x*-3+(1-e(g))*50},${(1-e(g))*20})`);
    pop(C.headset,g,`translate(${x*2},${y*1.5-(1-e(g))*40})`);
    pop(C.geekglasses,g,`translate(0,${-(1-e(g))*14})`);
    pop(C.hat,c,`translate(${x*2},${y*1.5-(1-e(c))*45}) rotate(${-6*c} 0 -40)`);
    pop(C.bandana,c,null); pop(C.straw,c,`rotate(${Math.sin(performance.now()/300)*4*c} 9 30)`);
    pop(C.archglasses,a,`translate(0,${(1-e(a))*-10})`); pop(C.turtle,a,null);
    pop(C.pen,a,`translate(0,${-(1-e(a))*30})`);
    pop(C.vr,v,`translate(0,${-(1-e(v))*45})`);
    pop(C.snorkel,sn,`translate(0,${-(1-e(sn))*45})`);
    pop(C.snorkelbody,sn,null);
    const gr=w.grad||0; pop(C.gradcap,gr,`translate(0,${-(1-e(gr))*50}) rotate(${(1-e(gr))*-12} 0 -80)`); pop(C.gradbody,gr,null);
  };
}

    vs+=((view==='L'?-1:view==='R'?1:0)-vs)*.25;
    const o=vs<0?OFF.L:OFF.R, k=Math.abs(vs);
    feat.setAttribute('transform',`translate(${o.eye*k},0) translate(${o.eye*k*0},-9) scale(${1-.07*k},1) translate(0,9)`);
    // costumes: front set ↔ turned set, crossfading with the drawings; right turn = mirrored left set
    const fo=view==='F'?op.F:1-op[view];
    cosF.setAttribute('opacity',fo); cosS.setAttribute('opacity',1-fo);
    cosS.setAttribute('transform',lastSide==='R'?'scale(-1,1)':'');
    mGeekS.setAttribute('opacity',wearNow.geek||0);
    hc.setAttribute('transform',`translate(${o.head*k},0)`);
    penWrap.setAttribute('transform',`translate(${vs>0?6.8*k:0},0)`);
    // pencil: its middle rests on top of the ear; foreshortened from the front, full length in profile
    { const f=.6+.4*(vs>0?k:0), L=49*f, cx=45, cy=-8, c=Math.cos(Math.PI/6), sn=Math.sin(Math.PI/6);
      penIn.setAttribute('transform',`translate(${cx-L/2*c},${cy-L/2*sn}) rotate(30) scale(${f},1)`); }
    penWrap.setAttribute('opacity',vs<0?Math.max(0,1-k*1.6):1);   // left turn hides that ear
  }
  let wearNow={};
  renderFace=(x,y,w)=>{
    wearNow=w;
    const g=w.geek,c=w.cowboy,a=w.architect;
    body.setAttribute('transform',`translate(${x*1.5},0)`); neck.setAttribute('transform',`translate(${x*2.5},0)`);
    head.setAttribute('transform',`translate(${x*4},${y*3}) rotate(${x*2.5-c*3} 0 45)`);
    const it=`translate(${x*10},${y*4})`; irisL.setAttribute('transform',it); irisR.setAttribute('transform',it);
    const by=(Math.min(0,y)*2+a*2.5-g*3.5)*u;
    browL.setAttribute('transform',`translate(0,${by}) rotate(${a*8} ${bL[0]} ${bL[1]})`);
    browR.setAttribute('transform',`translate(0,${by-c*4.5*u}) rotate(${-a*8-c*6} ${bR[0]} ${bR[1]})`);
    turn(x);
    const dx=x-px, dy=y-py; px=x; py=y;
    strands.forEach((st,i)=>{
      const target=-x*7 + y*2.5*(i?-1:1);                 // lean against the turn
      st.v+= (target-st.a)*st.k - dx*150 - dy*50*(i?1:-1);  // spring + swing from motion
      st.v*=st.d; st.a+=st.v; st.a=clamp(st.a,-16,16);
      const [rx,ry]=st.root;
      st.el.setAttribute('transform',`translate(${rx},${ry}) rotate(${st.a}) skewX(${st.a*.35}) translate(${-rx},${-ry})`);
    });
    costumes(x,y,w);
  };
  startBlink();
}
else if(CONFIG.face==='photo'){
  faceEl.innerHTML=`<img src="${CONFIG.photo}" alt="François Elias Nour">`;
  const img=faceEl.querySelector('img');
  renderFace=(x,y)=>{ img.style.transform=`perspective(600px) translate(${x*6}px,${y*5}px) rotateY(${x*10}deg) rotateX(${-y*8}deg) scale(1.12)`; };
}
else if(CONFIG.face==='grid'){
  const {pattern,rows,cols}=CONFIG.grid, srcs=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const s=pattern.replace('{r}',r).replace('{c}',c); srcs.push(s); new Image().src=s; }
  faceEl.innerHTML=`<img src="${srcs[Math.floor(srcs.length/2)]}" alt="François Elias Nour">`;
  const img=faceEl.querySelector('img'); let last='';
  renderFace=(x,y)=>{ const r=Math.round((y+1)/2*(rows-1)), c=Math.round((x+1)/2*(cols-1)), s=srcs[r*cols+c]; if(s!==last){img.src=s;last=s;} };
}

const tgt={x:0,y:0},cur={x:0,y:0}, ptr={x:-9999,y:-9999};
addEventListener('pointermove',e=>{
  ptr.x=e.clientX; ptr.y=e.clientY;
  const r=faceEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  tgt.x=clamp((e.clientX-cx)/(innerWidth*.4),-1,1);
  tgt.y=clamp((e.clientY-cy)/(innerHeight*.4),-1,1);
});
document.addEventListener('pointerleave',()=>{tgt.x=0;tgt.y=0;ptr.x=ptr.y=-9999});

/* costume per branch: the closer the cursor to any visible node of that branch, the stronger */
const COSTUMES={ geek:'toolbox', cowboy:'actor', architect:'architect', snorkel:'hobbies', vr:'art', grad:'education' };
const COSTUME_WORDS={ geek:/3d|tool|generalist/i, cowboy:/act/i, architect:/archit/i, snorkel:/hobb/i, vr:/art|install/i, grad:/educ|teach/i };
const branchFor=k=>N[COSTUMES[k]]||TOP.find(t=>COSTUME_WORDS[k].test(t.d.label));
const NEAR=25, FAR=200;               // screen px: full costume inside NEAR, none beyond FAR
const wear={geek:0,cowboy:0,architect:0,snorkel:0,vr:0,grad:0};
function proximity(top){
  let best=1e9; const walk=n=>{ if(n.shown){ const r=n.pill.getBoundingClientRect();
      const dx=Math.max(r.left-ptr.x,0,ptr.x-r.right), dy=Math.max(r.top-ptr.y,0,ptr.y-r.bottom);
      best=Math.min(best,Math.hypot(dx,dy)); } n.children.forEach(walk); };
  walk(top); return clamp(1-(best-NEAR)/(FAR-NEAR),0,1);
}
function wearTargets(){
  const t={}; const sel=current&&branchOf(current);
  if(sel){ for(const k in COSTUMES) t[k]=branchFor(k)===sel?1:0; return t; }   // branch open → its costume, locked
  for(const k in COSTUMES){ const top=branchFor(k); t[k]=top?proximity(top):0; }
  const max=Math.max(...Object.values(t)); for(const k in t) if(t[k]<max) t[k]=0;   // only the strongest wins
  return t;
}
(function loop(){
  cur.x+=(tgt.x-cur.x)*.1; cur.y+=(tgt.y-cur.y)*.1;
  const t=wearTargets(); for(const k in wear) wear[k]+=(t[k]-wear[k])*.08;
  renderFace(cur.x,cur.y,wear); requestAnimationFrame(loop);
})();

/* ---------- background carousel ---------- */
const slides=[...document.querySelectorAll('#bgc .slide')]; let slideIdx=0, slideList=[], slidePos=0, slideTimer=null;
const cache={}; const preload=u=>cache[u]||(cache[u]=new Promise(r=>{const im=new Image(); im.onload=()=>r(true); im.onerror=()=>r(false); im.src=u;}));
const srcOf=u=>typeof u==='string'?u:u&&u.src;
let slideNow=null;
function showInfo(){
  const u=slideNow; if(!u) return;
  $('#ic-branch').textContent=u.branch||''; $('#ic-count').textContent=slideList.length>1?`${slidePos+1} / ${slideList.length}`:'';
  $('#ic-title').textContent=u.title||''; $('#ic-text').textContent=u.text||''; $('#ic-credit').textContent=u.credit||'';
}
async function showSlide(item){
  const u=srcOf(item);
  if(!u||!(await preload(u))) return;
  slideNow=typeof item==='string'?{src:item}:item; showInfo();
  const next=slides[slideIdx^=1], prev=slides[slideIdx^1];
  next.style.transition='none'; next.classList.remove('on'); next.style.backgroundImage=`url("${u}")`;
  void next.offsetWidth; next.style.transition=''; next.classList.add('on'); prev.classList.remove('on');
}
function setSlides(list){
  if(list.map(srcOf).join()===slideList.map(srcOf).join()) return;
  slideList=list; slidePos=0; showSlide(list[0]); list.slice(1).forEach(u=>preload(srcOf(u)));
  clearInterval(slideTimer); slideTimer=setInterval(()=>{ if(slideList.length>1) showSlide(slideList[slidePos=(slidePos+1)%slideList.length]); },6500);
}
function updateSlides(){
  const br=current&&branchOf(current);
  const tag=(im,t)=>im&&Object.assign({},typeof im==='string'?{src:im}:im,{branch:t.d.label});
  if(current&&current.d.gallery&&current.d.gallery.length){
    const G=current.d.gallery; setSlides(G.map((u,i)=>({src:u,branch:current.d.label,title:current.d.label,text:current.d.film&&!current.d.film.agent?`${current.d.film.year} · ${current.d.film.by}`:'',credit:current.d.credit||''}))); return; }
  setSlides(br&&br.d.images?br.d.images.map(im=>tag(im,br)):TOP.map(t=>tag((t.d.images||[])[0],t)).filter(Boolean));   // home: one image per branch
}

/* ---------- swipe the sheet down to close ---------- */
(function(){
  const P=$('#panel'), G=P.querySelector('.grab'); let sy=null, dy=0;
  G.addEventListener('pointerdown',e=>{ sy=e.clientY; dy=0; P.style.transition='none'; G.setPointerCapture(e.pointerId); });
  G.addEventListener('pointermove',e=>{ if(sy===null) return; dy=Math.max(0,e.clientY-sy); P.style.transform=`translate(-50%,${dy}px)`; });
  const end=()=>{ if(sy===null) return; sy=null; P.style.transition=''; P.style.transform='';
    if(dy>70) closePanel(); };
  G.addEventListener('pointerup',end); G.addEventListener('pointercancel',end);
})();

/* ---------- info button (rises above the sheet) ---------- */
function lift(){ document.body.style.setProperty('--lift',($('#panel').offsetHeight+14+12)+'px'); }
lift(); addEventListener('resize',lift);
$('#info').onclick=e=>{ e.stopPropagation(); $('#infoCard').classList.toggle('open'); };
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('#infoCard,#info')) $('#infoCard').classList.remove('open'); });

/* ---------- start ---------- */
updateSlides();
/* ---------- Mural sync: load the board, merge with the details kept here, rebuild the map ---------- */
const PALETTE=[BLUE,GREEN,PINK,RED,'#e09a2b','#8a63d2','#2bb3a8'];
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
function localIndex(){ const m=new Map(); (function walk(list){ list.forEach(d=>{ m.set(norm(d.label),d); if(d.children) walk(d.children); }); })(DATA); return m; }
function mergeNode(m,local,depth,i){
  const L=local.get(norm(m.label))||{};
  const d=Object.assign({},L,Object.fromEntries(Object.entries(m).filter(([k,v])=>v!==''&&v!=null&&!(Array.isArray(v)&&!v.length)&&k!=='children'&&k!=='muralId')));
  if(L.id) d.id=L.id;                                   // keep the ids the costumes and links use
  if(depth===0){ d.pos=m.pos||L.pos||[i%2?235:-235,0]; d.color=m.color||L.color||PALETTE[i%PALETTE.length]; }
  else delete d.color;
  if(!m.gallery&&L.gallery) d.gallery=L.gallery;
  if(m.gallery&&!m.poster&&L.poster) d.poster=L.poster;
  if((d.url||d.gallery)&&!d.film) d.film={year:'',by:'',kind:'',note:'',site:d.url?new URL(d.url).hostname.replace(/^www\./,''):'',generic:true};
  d.children=(m.children||[]).map((c,j)=>mergeNode(c,local,depth+1,j));
  if(!d.children.length) delete d.children;
  return d;
}
function loadMap(j){
  const local=localIndex();
  const merged=j.nodes.map((m,i)=>mergeNode(m,local,0,i));
  const idOf=new Map(); (function walk(a,b){ a.forEach((m,k)=>{ idOf.set(m.id,b[k].id); if(m.children) walk(m.children,b[k].children); }); })(j.nodes,merged);
  Object.values(N).forEach(n=>{ n.el.remove(); n.link.remove(); }); for(const k in N) delete N[k];
  TOP.length=0; DATA.length=0; DATA.push(...merged);
  CROSS.length=0; (j.cross||[]).forEach(([a,b])=>{ const A=idOf.get(a),B=idOf.get(b); if(A&&B) CROSS.push([A,B]); });
  DATA.forEach(d=>TOP.push(build(d,null,Math.sign(d.pos[0])||1)));
  TOP.forEach(initNode); relayout(true);
  if(j.title) $('#name').textContent=j.title;
}
async function startMap(){
  fit();                                   // centre the face right away, before the board arrives
  if(CONFIG.mural){
    try{
      const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),3000);
      const r=await fetch(CONFIG.mural,{signal:ctl.signal}); clearTimeout(t);
      const j=await r.json();
      if(j&&j.nodes&&j.nodes.length) loadMap(j); else if(j&&j.error) console.warn('Mural:',j.error);
    }catch(e){ console.warn('Mural not reachable, using built-in content.',e); }
  }
  TOP.forEach((n,i)=>show(n,300+i*120));
  fit(); updateSlides();
}
startMap();
</script>
